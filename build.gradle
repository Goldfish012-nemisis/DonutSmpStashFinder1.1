plugins {
    // Voor Minecraft 26.1+ (niet-geobfusceerd) gebruikt Loom de nieuwe plugin-id.
    // Lukt dit niet, probeer dan: id 'fabric-loom' version '1.16-SNAPSHOT'
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
}

base {
    archivesName = project.archives_base_name
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url = "https://maven.meteordev.org/releases" }
    maven { url = "https://maven.meteordev.org/snapshots" }
}

dependencies {
    // Geen "mappings" regel meer: 26.1 gebruikt Mojang-namen rechtstreeks.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Geen modImplementation meer, gewoon implementation.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "meteordevelopment:meteor-client:${project.meteor_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}
